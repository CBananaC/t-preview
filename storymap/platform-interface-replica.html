<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="part-1-interface.css?v=20260812-skill-bundle-picker-02">
  <script src="part-1-interface-data.js?v=20260812-chat-source-01" defer></script>
    <script src="part-1-interface.js?v=20260812-skill-bundle-picker-02" defer></script>
  <style>
    :root {
      --font-scale: 1;
      --ink: #163d3f;
      --text: #3c5754;
      --paper: #f4efe6;
      --card: #fffaf2;
      --line: rgba(22, 61, 63, .18);
      --accent: #c45d38;
      --serif: "Noto Serif TC", "Source Han Serif TC", "PMingLiU", Georgia, serif;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", sans-serif;
      --body-weight: 500;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background: radial-gradient(circle at 84% 0%, rgba(196, 93, 56, .07), transparent 25rem), var(--paper);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    .replica-header {
      padding: clamp(26px, 5vw, 62px) clamp(16px, 4vw, 56px) clamp(22px, 3vw, 38px);
      color: #f7f3ea;
      background: #12363a;
      border-bottom: 1px solid rgba(255, 255, 255, .14);
    }
    .replica-header-inner,
    #part-1-content {
      width: min(1480px, calc(100% - 32px));
      margin: 0 auto;
    }
    .replica-kicker {
      margin: 0 0 10px;
      color: rgba(247, 243, 234, .68);
      font: 700 11px/1.4 var(--sans);
      letter-spacing: .14em;
    }
    .replica-header h1 {
      max-width: 18ch;
      margin: 0;
      font: 700 clamp(27px, 4vw, 48px)/1.25 var(--serif);
      letter-spacing: .06em;
    }
    .replica-header p:last-child {
      max-width: 72ch;
      margin: 16px 0 0;
      color: rgba(247, 243, 234, .78);
      font: 500 clamp(14px, 1.6vw, 17px)/1.8 var(--serif);
    }
    #part-1-content {
      padding: clamp(28px, 5vw, 68px) 0 80px;
    }
    .replica-section {
      margin: 0 0 clamp(38px, 6vw, 84px);
    }
    .replica-section:last-child { margin-bottom: 0; }
    .replica-section-heading {
      display: flex;
      align-items: baseline;
      gap: 12px;
      width: min(92ch, 100%);
      margin: 0 auto 18px;
      padding: 0 2px;
    }
    .replica-section-number {
      color: var(--accent);
      font: 800 13px/1 var(--sans);
      letter-spacing: .08em;
    }
    .replica-section-heading h2 {
      margin: 0;
      font: 700 clamp(20px, 2.2vw, 30px)/1.4 var(--serif);
      letter-spacing: .05em;
    }
    .replica-section-heading p {
      margin: 0 0 0 auto;
      color: #6d756f;
      font: 500 12px/1.6 var(--sans);
    }
    .part1-section-visual { width: 100%; }
    @media (max-width: 700px) {
      .replica-header-inner, #part-1-content { width: min(100% - 20px, 1480px); }
      .replica-section-heading { display: block; }
      .replica-section-heading p { margin: 6px 0 0 29px; }
    }
  </style>
  <title>平台介面｜清代奏摺與上諭分析平台</title>
</head>
<body>
  <header class="replica-header">
    <div class="replica-header-inner">
      <p class="replica-kicker">清代奏摺與上諭分析平台・互動複本</p>
      <h1>平台的整體介面</h1>
      <p>以下頁面保留「平台介面」分頁的完整互動複本，載入示範文書硃42，並把目前 sample 的硃40／諭24 保存 AI 對話輸出列入 AI 分析區，讓讀者可以在同一個畫面試用導覽列、時間與關係圖表、原始史料區和人工智能分析區；點擊圖表節點後，對應的輸出卡片與可追溯的 AI 對話來源會在 AI 分析區開啟。</p>
    </div>
  </header>

  <main id="part-1-content">
    <section class="replica-section replica-section-combined" aria-labelledby="replica-combined-title">
      <div class="replica-section-heading">
        <span class="replica-section-number">01</span>
        <h2 id="replica-combined-title">完整平台介面複本</h2>
      </div>
      <div class="part1-section-visual" data-part1 role="group" aria-label="平台介面完整互動示範複本">
        <div class="part1-replica" data-part1-replica data-skill-api-base="http://127.0.0.1:8166" aria-live="polite"></div>
      </div>
    </section>
  </main>
</body>
</html>
