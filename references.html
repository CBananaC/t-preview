<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>參考文獻</title>
  <style>
    :root {
      --ink: #173b3f;
      --muted: #678082;
      --paper: #f3eee4;
      --card: #fffdf8;
      --accent: #a45e4c;
      --serif: Georgia, "Songti TC", "STSong", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 22px 80px; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    main { width: min(820px, 100%); margin: 0 auto; }
    h1 { margin: 0 0 28px; font: 600 30px/1.2 var(--serif); }
    .back { display: inline-block; margin-bottom: 30px; color: var(--accent); font-size: 13px; text-decoration: none; }
    .back:hover { color: var(--ink); text-decoration: underline; }
    ol { margin: 0; padding: 24px 28px 24px 52px; background: var(--card); box-shadow: 0 12px 28px rgba(44, 48, 39, .1); }
    li { padding-left: 8px; font: 16px/1.9 var(--serif); }
    .status { margin-top: 20px; color: var(--muted); font: 13px/1.7 var(--sans); }
  </style>
</head>
<body>
  <main>
    <a class="back" href="storymap/storymap-example.html#intro-1-3">← 返回引言</a>
    <h1>參考文獻</h1>
    <ol>
      <li id="ref-zhuang-1979">莊吉發。《清代奏摺制度》。1979年。</li>
      <li id="ref-dai-2019">戴英從。《The White Lotus War: Rebellion and Suppression in Late Imperial China》。2019年。第一章。頁碼待核。</li>
      <li id="ref-xu-2008">許毓良。《清代臺灣軍事與社會》。2008年。</li>
    </ol>
    <p class="status">頁碼待核；此項目會在參考資料確認後補充。</p>
  </main>
</body>
</html>
